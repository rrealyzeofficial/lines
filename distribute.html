<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>REALYZE Lines — Chia lời</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="distribution-page">
<header class="topbar"><a class="wordmark" href="index.html"><b>RƎ:ALYZE</b><span>LINES</span></a><div class="distribute-title"><span id="songStatusPill" class="status-pill draft">Đang chia</span><strong id="songTitleHead">...</strong></div><div class="top-actions"><span id="saveState" class="save-state">Đã lưu</span><button id="saveBtn" class="ghost-btn">Lưu</button><button id="previewBtn" class="ghost-btn">Preview</button><button id="finishBtn" class="primary-btn compact">Hoàn tất</button></div></header>
<main class="distribution-shell">
  <section class="song-strip"><div id="coverThumb" class="song-strip-cover"></div><div class="song-strip-info"><span class="eyebrow">NOW DISTRIBUTING</span><h1 id="songTitle">...</h1><div id="memberLegend" class="member-legend"></div></div><audio id="songAudioPlayer" controls preload="metadata"></audio></section>

  <section class="lyrics-editor-card">
    <div class="lyrics-editor-head">
      <div><span class="eyebrow">LYRICS EDITOR</span><h2>Sửa lời</h2></div>
      <button id="toggleLyricsEditor" type="button" class="ghost-btn">Sửa toàn bộ lời</button>
    </div>
    <div id="lyricsEditorPanel" class="lyrics-editor-panel hidden">
      <textarea id="lyricsEditor" rows="12" spellcheck="false" placeholder="Line 1&#10;Line 2&#10;&#10;Line 3"></textarea>
      <div class="lyrics-editor-actions"><span id="lyricsEditorCount" class="lyrics-editor-count"></span><button id="cancelLyricsEdit" type="button" class="ghost-btn">Hủy</button><button id="applyLyricsEdit" type="button" class="primary-btn compact">Cập nhật lời</button></div>
    </div>
  </section>

  <section class="distribution-card"><div class="table-scroll"><table id="lineTable" class="line-table"><thead id="lineTableHead"></thead><tbody id="lineTableBody"><tr><td>Đang tải...</td></tr></tbody></table></div></section>
  <section class="stats-card"><div class="section-heading"><div><span class="eyebrow">BALANCE</span><h2>Line distribution</h2></div></div><div id="lineStats" class="stats-grid"></div></section>
</main>

<div id="previewModal" class="modal hidden"><div class="modal-backdrop" data-close-preview></div><section class="modal-card preview-card"><div class="modal-head"><div><span class="eyebrow">PREVIEW</span><h2 id="previewTitle">...</h2></div><button class="icon-btn" data-close-preview>×</button></div><div id="previewLyrics" class="preview-lyrics"></div></section></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="shared.js"></script><script src="distribute.js"></script>
</body>
</html>
